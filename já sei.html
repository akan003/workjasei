<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Já Sei</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans">
  <div class="max-w-3xl mx-auto p-6">
    <div class="bg-gradient-to-r from-blue-600 to-blue-800 text-white p-8 rounded-xl shadow-lg mb-8">
      <h1 class="text-5xl font-bold text-center mb-4">Já Sei</h1>
      <p class="text-center text-xl opacity-90">Descubra onde estudar e o que ler para crescer na sua carreira</p>
    </div>
    
    <!-- Campo de busca -->
    <div class="flex items-center gap-2 mb-8 bg-white p-4 rounded-xl shadow-md">
      <input id="areaInput" type="text" placeholder="Digite sua área de atuação..." 
             class="flex-1 p-4 rounded-lg border-0 bg-gray-50 focus:ring-2 focus:ring-blue-500 focus:bg-white transition"/>
      <button onclick="buscarCursos()" class="bg-gradient-to-r from-blue-600 to-blue-800 text-white px-6 py-3 rounded-lg hover:from-blue-700 hover:to-blue-900 transition transform hover:scale-105 shadow-md">
        Buscar
      </button>
    </div>

    <!-- Resultados -->
    <div id="resultados" class="space-y-6"></div>
  </div>

  <script>
    const dadosMock = {
      "programador": {
        cursos: [
          { nome: "Curso de Desenvolvimento Web - Alura", link: "https://www.alura.com.br", preco: "R$ 89/mês" },
          { nome: "Full Stack Developer - DIO", link: "https://www.dio.me", preco: "Gratuito" },
        ],
        livros: [
          "Clean Code - Robert C. Martin",
          "O Programador Pragmático - Andrew Hunt e David Thomas",
          "Estruturas de Dados e Algoritmos em JavaScript - Loiane Groner"
        ]
      },
      "eletricista": {
        cursos: [
          { nome: "Curso de Eletricista Profissional - Senai", link: "https://www.portaldaindustria.com.br/senai", preco: "R$ 199" },
          { nome: "Eletricista Residencial - Prime Cursos", link: "https://www.primecursos.com.br", preco: "Gratuito (com opção de certificado pago)" },
        ],
        livros: [
          "Manual do Eletricista - Newton Braga",
          "Instalações Elétricas - Helio Creder",
          "Eletricidade Básica - Antônio Márcio"
        ]
      },
      "matematico": {
        cursos: [
          { nome: "Licenciatura em Matemática - Univesp", link: "https://univesp.br", preco: "Gratuito" },
          { nome: "Matemática para Concursos - Estratégia", link: "https://www.estrategiaconcursos.com.br", preco: "R$ 129/mês" },
        ],
        livros: [
          "Curso de Matemática - Iezzi",
          "Matemática: Conteúdo e Didática - Dante",
          "Fundamentos de Matemática Elementar - Gelson Iezzi"
        ]
      },
      "fisico": {
        cursos: [
          { nome: "Bacharelado em Física - USP", link: "https://www5.usp.br", preco: "Gratuito (universidade pública)" },
          { nome: "Física Geral - Khan Academy", link: "https://pt.khanacademy.org", preco: "Gratuito" },
        ],
        livros: [
          "Física para Cientistas e Engenheiros - Serway",
          "Fundamentos da Física - Halliday, Resnick e Walker",
          "Mecânica Clássica - Kleppner"
        ]
      },
      "engenheiro": {
        cursos: [
          { nome: "Engenharia Civil - Uninter", link: "https://www.uninter.com", preco: "R$ 399/mês" },
          { nome: "Engenharia Elétrica - Cruzeiro do Sul Virtual", link: "https://www.cruzeirodosulvirtual.com.br", preco: "R$ 350/mês" },
        ],
        livros: [
          "Engenharia: Uma Introdução - Paul Wright",
          "Resistência dos Materiais - Hibbeler",
          "Projeto de Engenharia - Dieter"
        ]
      }
    };

    function buscarCursos() {
      const area = document.getElementById("areaInput").value.toLowerCase();
      const resultadosDiv = document.getElementById("resultados");
      resultadosDiv.innerHTML = ""; // Limpa resultados anteriores

      const dados = dadosMock[area];
      if (!dados) {
        resultadosDiv.innerHTML = "<p class='text-red-600'>Nenhum resultado encontrado para essa área.</p>";
        return;
      }

      const cursosHTML = dados.cursos.map(curso => `
        <li class="bg-gray-50 hover:bg-blue-50 p-3 rounded-lg transition">
          <a href="${curso.link}" target="_blank" class="text-blue-700 hover:text-blue-900 font-medium flex items-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
              <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
              <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd" />
            </svg>
            ${curso.nome}
          </a>
          <span class="text-sm text-gray-500 ml-7">${curso.preco}</span>
        </li>
      `).join("");

      const livrosHTML = dados.livros.map(livro => `
        <li class="bg-gray-50 hover:bg-blue-50 p-3 rounded-lg transition flex items-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-gray-500" viewBox="0 0 20 20" fill="currentColor">
            <path d="M9 4.804A7.968 7.968 0 005.5 4c-1.255 0-2.443.29-3.5.804v10A7.969 7.969 0 015.5 14c1.669 0 3.218.51 4.5 1.385A7.962 7.962 0 0114.5 14c1.255 0 2.443.29 3.5.804v-10A7.968 7.968 0 0014.5 4c-1.255 0-2.443.29-3.5.804V12a1 1 0 11-2 0V4.804z" />
          </svg>
          ${livro}
        </li>
      `).join("");

      resultadosDiv.innerHTML = `
        <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-100">
          <div class="mb-6">
            <h2 class="text-2xl font-bold mb-4 text-blue-800 border-b pb-2">Cursos recomendados</h2>
            <ul class="list-none space-y-3">${cursosHTML}</ul>
          </div>
          <div>
            <h2 class="text-2xl font-bold mb-4 text-blue-800 border-b pb-2">Livros sugeridos</h2>
            <ul class="list-none space-y-3 pl-0">${livrosHTML}</ul>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
